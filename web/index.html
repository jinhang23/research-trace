<!doctype html>
<!-- lang 的初值就是 i18n.DEFAULT（en）。app.js 启动时会按 localStorage 里存的偏好
     覆盖它，切换语言时也跟着改——浏览器的断词、朗读、拼写检查都看这一个属性。 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>__TITLE__</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='3' r='2.2' fill='%23777'/><circle cx='4' cy='13' r='2.2' fill='%23999'/><circle cx='12' cy='13' r='2.2' fill='%23555'/><path d='M8 5v3M8 8h4v3M8 8H4v3' stroke='%23888' fill='none' stroke-width='1.4'/></svg>">
<link rel="stylesheet" href="__ASSET__style.css">
</head>

<!-- 静态文案怎么进这一页：**结构留在 HTML 里，字全部由 data-i18n 在启动时刷进去**。
     元素本身不带任何一种语言的文字（不是「先写英文再翻」）。
     三条理由：
       1) 一份文案只有一处真相。把英文写死在标签里、再让 JS 覆盖，等于同一句话
          存了两份——改 i18n.js 而忘了改这里，页面上就永远是那句旧的。
       2) 结构还看得见。全改成 JS 生成的话，「顶栏上到底有哪些控件」就得去读
          一千行 app.js 才知道；对着这个文件能一眼看完。
       3) 刷新只有一条路径。切语言时 paintChrome() 重跑一遍同样的属性扫描，
          和首屏走的是同一段代码，不存在「首屏对了、切换后漏了一处」。
     四种属性分别对应四个目的地：
       data-i18n       → textContent（纯文本）
       data-i18n-html  → innerHTML（走 tHtml，**粗体** / `代码` / 换行会展开）
       data-i18n-title → title=
       data-i18n-ph    → placeholder=
     文案里出现 ** 或反引号或 \n 的一律用 -html，否则会把标记原样显示出来。 -->
<body>

<header id="top">
  <select id="proj" data-i18n-title="app.proj.switch"></select>
  <div class="grow">
    <input id="search" type="search" data-i18n-ph="app.search.placeholder" autocomplete="off" spellcheck="false">
    <!-- 搜索范围。agent 的 trace_search 不给 project 就搜全部，人这边也得有同一个能力。
         文案由 paintScope() 按当前范围写，所以这里不挂 data-i18n -->
    <button id="btn-scope" type="button"></button>
    <span id="hits" class="mono"></span>
  </div>
  <!-- ⑨ 章节筛选。它**不在**下面那两排切换器里，这不是排版偏好：
       第一级选「看哪一份东西」（开发路径 / 定稿流程），第二级选「同一份东西怎么画」
       （图 / 列表 / 数据流），而章节两件都不改——它选的是**看多大范围**，
       横切在那两级之上：开发路径要能按章节看，定稿流程也要按章节编。
       所以它长在搜索框旁边（同样是「缩小注意力范围」那一类动作），而不是在
       那两排按钮里再加一个格子——加进去就等于说「章节是第三种画法」。
       选项与内容全部由 app.js 的 renderChapFilter() 按 forest.chapters 生成，
       一个 `chapter:` 都没写的项目里它**整个不渲染**：多一个恒灰的下拉框，
       就已经不是「现存项目完全无感」了。 -->
  <select id="chapfilter" hidden></select>
  <!-- 切换器是**两级**的，这不是排版偏好，是这两样东西本来的层次。
       第一级「开发路径 / 定稿流程」选的是**看哪一份东西**：开发路径是这棵树的
       全部（含走不通的、含还悬着的岔路口），定稿流程是从 `result:` 沿 `input:`
       反推出来的那条链——两者的步骤集合根本不一样。
       第二级「图 / 列表 / 数据流」选的是**同一份东西怎么画**。
       把定稿流程做成第四个并排的按钮，等于对读者说「这是同一件事的另一种排版」，
       而那正是 i18n 的 pipeline.pair.note 专门写来挡的那个误解；反过来，把三种
       画法提到第一级，又会让人以为数据流和定稿流程是一回事（一个是 input 的
       全图，一个是成果的闭包）。所以一级选东西、二级选画法。
       第二级只在开发路径下出现：定稿流程只有一种画法（它就是一张方法图）。 -->
  <div class="modeswitch" id="modeswitch">
    <div class="seg mode" id="modetoggle">
      <button type="button" data-mode="dev" data-i18n="app.view.dev" data-i18n-title="app.view.dev.title"></button><button type="button" data-mode="pipeline" data-i18n="app.view.pipeline" data-i18n-title="app.view.pipeline.title"></button>
    </div>
    <div class="seg sub" id="viewtoggle">
      <button data-view="graph" data-i18n="app.view.graph" data-i18n-title="app.view.graph.title"></button><button data-view="list" data-i18n="app.view.list" data-i18n-title="app.view.list.title"></button><button data-view="flow" data-i18n="app.view.flow" data-i18n-title="app.view.flow.title"></button>
    </div>
  </div>
  <button id="btn-new" data-i18n="app.new" data-i18n-title="app.new.title"></button>
  <!-- 新建项目必须在顶栏：只剩一个项目时项目索引页会 302 弹回项目页，
       按钮长在那个页面上就等于永远点不到 -->
  <button id="btn-newproj" data-newproj="1" data-i18n="app.newproj" data-i18n-title="app.newproj.title"></button>
  <!-- 语言开关。顶栏已经有搜索、项目选择、令牌、同步状态了，所以它只有两个
       两字宽的格子：按钮上写的是**语言自己的名字**（EN / 中），不翻译——
       在一个自己看不懂的界面里找语言开关时，你要找的正是母语那两个字。
       完整名字（English / 中文）在 title 里。 -->
  <div class="seg lang" id="langtoggle" data-i18n-title="app.lang.title">
    <button type="button" data-lang="en" data-i18n-title="lang.en">EN</button><button type="button" data-lang="zh" data-i18n-title="lang.zh">中</button>
  </div>
  <button id="btn-token" data-i18n-title="app.token.title">🔒</button>
  <!-- 数据仓同步：平时只是一个小箭头，失败时旁边那块红的会露出来 -->
  <span id="gitdot" class="gitdot" hidden></span>
  <button id="gitwarn" data-gitretry="1" hidden></button>
  <span id="live" class="dot"></span>
</header>

<!-- 跨项目搜索结果。挂在顶栏下面而不是抢走详情面板：搜索是「顺手查一下」，
     不该把你正在读的那一步顶掉 -->
<div id="hitlist" hidden></div>

<div id="warnbar" hidden></div>

<!-- 「记下来的位置已经不在了」的整块汇总。它不能只藏在某一步的详情里：用户这次
     是手工核对 164 条路径才发现三个目录没了（57 GB 的那个）。记录一条都不删，
     只是标出来——一个曾经装着 57 GB、现在空了的位置是一条发现，不是笔误。 -->
<div id="missbar" hidden></div>

<!-- 「还有几个岔路口没做决定」。这是互斥候选这件事真正的收益：隔一个月回到一个
     项目，最该先看的就是这份清单。只画在单步详情里等于没有——那要求人先猜到
     该点哪一步。它**不是**警告：同时开几条线是研究的常态，所以它长得像
     #missbar 那种陈述，不像 #warnbar 那种待办。 -->
<div id="forkbar" hidden></div>

<!-- 项目索引：没有选中项目时显示 -->
<section id="home" hidden>
  <div class="home-head">
    <h1>__TITLE__</h1>
    <button data-newproj="1" class="primary" data-i18n="home.new"></button>
  </div>
  <div id="cards"></div>
</section>

<main id="main" hidden>
  <section id="left">
    <div id="scroller">
      <!-- 图视图：SVG 画边，HTML 卡片叠在上面（文本截断/hover 都好做） -->
      <div id="dwrap" hidden>
        <div id="diagram">
          <svg id="dedges" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
          <!-- 分叉点的括弧标注（「3 选 1」/「已定：012b」/「都不行」）。用 HTML
               叠层而不是 SVG <text>：要截断、要 tooltip、要跟着深浅主题走。
               排在 #dnodes **之前**，于是它永远抢不走卡片的点击。 -->
          <div id="dmarks" aria-hidden="true"></div>
          <div id="dnodes"></div>
        </div>
      </div>
      <!-- 列表视图：轨道 SVG + 定高行，两者靠固定行高对齐 -->
      <div id="track" hidden>
        <svg id="rails" xmlns="http://www.w3.org/2000/svg" width="0" height="0" aria-hidden="true"></svg>
        <div id="rows"></div>
      </div>
      <!-- 数据流视图：分层 DAG。边是**声明出来的 input**，树一个字没改——
           这是同一批文件的第二种读法，不是第二份数据。 -->
      <div id="fwrap" hidden>
        <h2 id="flowtitle" class="viewtitle" data-i18n="flow.title"></h2>
        <p id="flowlead" class="viewlead" data-i18n-html="flow.lead"></p>
        <p id="flowempty" class="viewlead quiet" hidden data-i18n="flow.empty"></p>
        <div id="flow">
          <svg id="fedges" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
          <div id="fnodes"></div>
        </div>
      </div>
      <!-- 定稿流程。它**不在**上面那三个之列：那三个画的是同一批步骤，这一个
           画的是另一批。整块内容由 app.js 的 renderPipeline() 生成——它不是一张
           静态骨架，而是一份随成果声明一起变的文档（空态、成果清单、等级、
           那张图、逐步的做法、三个导出），写死在 HTML 里的只有这个容器。 -->
      <div id="pwrap" hidden></div>
      <p id="empty" hidden data-i18n-html="list.empty"></p>
    </div>
    <!-- 「提为根」的落区。只在拖动期间出现，而且**只有落在它上面才算**：
         「没落在任何卡片上就当成提为根」是最容易误触发的判定，而误触发的代价是
         一条写进 note.md 的永久审计外加一句被逼出来的原因。落在别的空白处
         等于取消。
         它是 #scroller 的**兄弟**，不是盖在上面的浮层：浮层在列表视图里会正好压住
         最上面那两行，于是那两步永远拖不上去——一条落区不该吃掉别的落点。
         排在 #scroller 之后（贴着图例），出现时滚动区从下面缩短，画布内容一个像素
         都不动。pointer-events 关掉：命中与否由坐标判，它不该抢走任何点击。 -->
    <div id="droot" hidden aria-hidden="true">
      <b data-i18n="drag.root.label"></b><span data-i18n="drag.root.hint"></span>
    </div>
    <footer id="legend">
      <!-- 图例分三组：**线型 = 状态**、**边 = 三种关系**、**字形 = 那五个标记**。
           不分组的话这一行就是十一个并排的小东西，而它们分属三个互不相干的通道，
           混排会让人以为「实线 = 延伸」——那正是这次要说清的反面。 -->
      <span id="treelegend">
        <span class="lgset">
          <span><i class="lg done"></i><span data-i18n="list.legend.done"></span></span>
          <span><i class="lg wip"></i><span data-i18n="list.legend.wip"></span></span>
          <span><i class="lg dead"></i><span data-i18n="list.legend.dead"></span></span>
        </span>
        <!-- 三种关系。色样里那几个 SVG 就是图上真正画出来的形状：延伸是正交折线、
             互斥候选是一道括起来的括弧、汇回是带箭头的曲线。颜色一眼扫到，
             形状说得准——灰度打印和色觉障碍下丢掉的只是那一眼。
             SVG 走 currentColor，颜色由 <i> 上的 class 给，深浅主题各一套。 -->
        <span class="lgset lgrels">
          <span class="lgm"><i class="lgrel r-ext"><svg viewBox="0 0 20 12" aria-hidden="true"><path d="M4 1V6h12v5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></i><span class="lgtext" data-i18n="list.legend.extends" data-i18n-title="list.legend.extends.title"></span></span>
          <span class="lgm"><i class="lgrel r-alt"><svg viewBox="0 0 20 12" aria-hidden="true"><path d="M3 4V2h14v2M3 4v7M17 4v7" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></i><span class="lgtext" data-i18n="list.legend.alternative" data-i18n-title="list.legend.alternative.title"></span></span>
          <span class="lgm"><i class="lgrel r-join"><svg viewBox="0 0 20 12" aria-hidden="true"><path d="M2 3C8 3 7 9 12 9" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 6.4v5.2l4.6-2.6z" fill="currentColor"/></svg></i><span class="lgtext" data-i18n="list.legend.rejoin" data-i18n-title="list.legend.rejoin.title"></span></span>
        </span>
        <!-- 字形标记是第四个通道：不抢线型（status）也不抢不透明度（祖先链/搜索）。
             ↺✕ L0 ⇢ ⇄ ⊘ Y ~> 这些字形在两种语言里都不翻——它们是记号，不是词 -->
        <span class="lgset">
          <span class="lgm"><i class="cmk lv0">L0</i><span data-i18n="list.legend.l0"></span></span>
          <span class="lgm"><i class="cmk rfail">↺✕</i><span data-i18n="list.legend.reprofail"></span></span>
          <span class="lgm"><i class="cmk dep">⇢</i><span data-i18n="flow.legend.data"></span></span>
          <span class="lgm"><i class="cmk fork">Y</i><span data-i18n="branch.kind.alternative" data-i18n-title="branch.kind.alternative.title"></span></span>
          <span class="lgm"><i class="cmk join">~&gt;</i><span data-i18n="rejoin.kind" data-i18n-title="rejoin.kind.title"></span></span>
          <span class="lgm"><i class="cmk moved">⇄</i><span data-i18n="move.badge"></span></span>
          <span class="lgm"><i class="cmk gone">⊘</i><span data-i18n="path.missing.badge"></span></span>
          <!-- 开发路径上「这一步在定稿流程里」的回指。用的是**字形**这个第四通道：
               线型仍然只归 status，不透明度仍然只归祖先链/搜索命中，颜色已经归了
               三种关系。方括号里的数字就是它在流程里的第几步——和那张图上、
               Methods 草稿里的编号是同一个，于是两条路径互相指得回去。 -->
          <span class="lgm"><i class="cmk pipe">[1]</i><span data-i18n="pipeline.badge" data-i18n-title="pipeline.badge.title"></span></span>
        </span>
        <!-- ⑨ 章节。两样东西，两个**新**通道：底色带（同一章的卡片压在同一块
             底色上，卡片左侧还有一道同色的窄条）和跨章记号（一对 45° 小斜杠钉在
             那条边的中点上）。线型仍然只归 status、不透明度仍然只归「和你此刻的
             关注有没有关系」、颜色仍然只归三种关系——一个都没借。
             这一组只在项目真有章节时才露出来（app.js 的 renderChapFilter 一起管）。 -->
        <span class="lgset" id="chaplegend" hidden>
          <span class="lgm"><i class="lgband ch-0"></i><span data-i18n="chapter.name" data-i18n-title="chapter.lead"></span></span>
          <span class="lgm"><i class="lgcross"><svg viewBox="0 0 20 12" aria-hidden="true"><path d="M10 0v12" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6.5 8.2L12 2.4M8.5 9.6L14 3.8" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></i><span data-i18n="chapter.cross.legend" data-i18n-title="chapter.cross.note"></span></span>
        </span>
        <!-- 「颜色负责一眼扫到，形状负责说得准」那句话。压成一行加省略号、整句在
             title 里：图例是常驻的，让它长到三行就是永久吃掉一块画布。 -->
        <span class="lgnote" data-i18n-html="list.legend.note" data-i18n-title="list.legend.note"></span>
      </span>
      <!-- 数据流的图例分三条是刻意的：「parent 和 input 是同一步」占了绝大多数边，
           不给它单独一档，读者会以为这张图把树边画丢了。 -->
      <span id="flowlegend" hidden>
        <span><i class="fl tree"></i><span data-i18n="flow.legend.tree"></span></span>
        <span><i class="fl data"></i><span data-i18n="flow.legend.data"></span></span>
        <span><i class="fl both"></i><span data-i18n="flow.legend.both"></span></span>
      </span>
      <span class="sp"></span>
      <span id="zoombar">
        <button data-zoom="out" data-i18n-title="list.zoom.out">−</button>
        <button data-zoom="reset" data-i18n-title="list.zoom.reset"><span id="zoomval">100%</span></button>
        <button data-zoom="in" data-i18n-title="list.zoom.in">＋</button>
        <button data-zoom="fit" data-i18n-title="list.zoom.fit" data-i18n="list.zoom.fit.label"></button>
      </span>
    </footer>
  </section>

  <section id="detail" tabindex="-1"></section>
</main>

<dialog id="dlg-new">
  <form method="dialog">
    <h2 data-i18n="newstep.title"></h2>
    <div id="nf-draft" class="draftbar" hidden>
      <b data-i18n="newstep.draft.found"></b><span class="mono" id="nf-draft-when"></span>
      <span id="nf-draft-title"></span>
      <span class="sp"></span>
      <button type="button" data-newdraft="restore" data-i18n="newstep.draft.restore"></button>
      <button type="button" data-newdraft="discard" data-i18n="newstep.draft.discard"></button>
    </div>
    <!-- 每个 label 里的字都包在自己的 <span> 里：data-i18n 写的是 textContent，
         直接挂在 <label> 上会把里面的 <input> 一起冲掉 -->
    <label><span data-i18n="newstep.parent"></span><input id="nf-parent" class="mono" readonly></label>
    <label><span data-i18n="newstep.field.title"></span><input id="nf-title" maxlength="200" required data-i18n-ph="newstep.title.placeholder"></label>
    <div class="row2">
      <label><span data-i18n="newstep.field.status"></span>
        <select id="nf-status">
          <option value="wip" data-i18n="newstep.status.wip"></option>
          <option value="done" data-i18n="newstep.status.done"></option>
          <option value="dead" data-i18n="newstep.status.dead"></option>
        </select>
      </label>
      <label><span data-i18n="newstep.field.date"></span><input id="nf-date" class="mono" type="date"></label>
    </div>
    <label><span data-i18n="newstep.field.commit"></span><input id="nf-commit" class="mono" data-i18n-ph="newstep.commit.placeholder"></label>
    <label><span data-i18n-html="editor.paths.label"></span>
      <textarea id="nf-paths" rows="2" spellcheck="false" data-i18n-ph="newstep.paths.placeholder"></textarea>
    </label>
    <!-- 数据依赖和代码位置。inputs 不从父步骤继承（照抄一遍等于替人编造一条
         他没做过的声明），code 继承——同一条线上代码在哪多半没变。 -->
    <label><span data-i18n="newstep.field.inputs"></span>
      <textarea id="nf-inputs" rows="2" spellcheck="false" data-i18n-ph="editor.inputs.placeholder"></textarea>
    </label>
    <label><span data-i18n="newstep.field.code"></span>
      <textarea id="nf-code" rows="2" spellcheck="false" data-i18n-ph="editor.code.placeholder"></textarea>
    </label>
    <!-- 这一步和父步骤之间那条边是什么性质，以及这一步自己开出的那个问题。
         两者都**不从父步骤继承**（见 app.js 的 openNew）：branch 说的是「我和我
         parent 之间那条边」，抄下去就会让从候选 A 往下走的每一步都变成候选。 -->
    <div class="row2">
      <label><span data-i18n="editor.branch.label"></span>
        <select id="nf-branch">
          <option value="extends" data-i18n="editor.branch.extends"></option>
          <option value="alternative" data-i18n="editor.branch.alternative"></option>
        </select>
      </label>
      <label><span data-i18n="editor.branch.note.label"></span>
        <input id="nf-bnote" maxlength="200" data-i18n-ph="editor.branch.note.placeholder">
      </label>
    </div>
    <p class="hint" data-i18n-html="editor.branch.hint"></p>
    <label><span data-i18n="editor.decision.label"></span>
      <input id="nf-decision" maxlength="300" data-i18n-ph="editor.decision.placeholder">
    </label>
    <p class="hint" data-i18n-html="editor.decision.hint"></p>
    <!-- ⑨ 这一步开不开一条新线（一个章节）。和 branch / decision 一样**不从父步骤
         继承**，而且理由更硬：章节本来就是沿树继承的，把父步骤那个名字预填进来
         等于把继承展开成一份会过期的拷贝——父步骤改个名字，这一步就留在旧章里。
         留空 = 跟着上面那条线走。maxlength 对着 trace_write.MAX_CHAPTER。 -->
    <div class="row2">
      <label><span data-i18n="editor.chapter.label"></span>
        <input id="nf-chap" maxlength="60" data-i18n-ph="editor.chapter.placeholder">
      </label>
      <label><span data-i18n="editor.chapter.note.label"></span>
        <input id="nf-chnote" maxlength="200" data-i18n-ph="editor.chapter.note.placeholder">
      </label>
    </div>
    <p class="hint" data-i18n-html="editor.chapter.hint"></p>
    <!-- 正文语言 ≠ 界面语言。界面是英文的人完全可能用中文记笔记，而这几个小节
         标题是要写进 note.md 的**内容**，写错了 trace_core 就找不到「为什么」，
         评级和 check 一起失灵。所以这里给一个显式的选择，默认值由
         guessContentLang() 从兄弟步骤已经在用的小节名推出来（见 app.js）。 -->
    <div class="bodyhead">
      <span data-i18n="newstep.field.body"></span>
      <span class="sp"></span>
      <select id="nf-lang" class="minisel" data-i18n-title="app.lang.title">
        <option value="zh" data-i18n="lang.zh"></option>
        <option value="en" data-i18n="lang.en"></option>
      </select>
    </div>
    <textarea id="nf-body" rows="12" spellcheck="false"></textarea>
    <p class="hint" data-i18n="newstep.hint"></p>
    <menu>
      <button value="cancel" data-i18n="newstep.cancel"></button>
      <button id="nf-ok" value="ok" class="primary" data-i18n="newstep.create"></button>
    </menu>
  </form>
</dialog>

<!-- ① 换一个父节点。P2 的地基是「不丢历史」，不是「不能改结构」——记下来就不丢。
     原因**不是可选项**：一个可选的输入框会让人先点了确定才发现要写，转头就回去
     用「把两步的正文对调」那种不留痕迹的老办法。 -->
<dialog id="dlg-move">
  <form method="dialog">
    <h2 id="mv-title"></h2>
    <p class="hint" data-i18n-html="move.dialog.hint"></p>
    <label><span data-i18n="move.field.parent"></span><select id="mv-parent" class="mono"></select></label>
    <label><span data-i18n="move.field.reason"></span>
      <input id="mv-reason" maxlength="300" required data-i18n-ph="move.reason.placeholder">
    </label>
    <p class="hint req" data-i18n="move.reason.required"></p>
    <!-- 只有拖出来的移动才显示：手势很容易让人以为「我把这条线接到别处去了」，
         而拖拽动的只有 parent。inputs 说的是字节从哪来，它一个字都没变。 -->
    <p class="hint" id="mv-dragnote" hidden data-i18n-html="move.dragged.note"></p>
    <p class="hint mverr" id="mv-err" hidden></p>
    <menu>
      <button value="cancel" data-i18n="move.cancel"></button>
      <button id="mv-ok" value="ok" class="primary" data-i18n="move.submit"></button>
    </menu>
  </form>
</dialog>

<!-- 离开编辑器前的确认。三个出口而不是两个：用户真正想说的第三件事是
     「这段我不要了，别再拿草稿烦我」 -->
<dialog id="dlg-leave">
  <div class="dlgbody">
    <h2 data-i18n="leave.title"></h2>
    <p class="hint"><b id="leave-what" class="mono"></b><br><span data-i18n="leave.hint"></span></p>
    <menu>
      <button type="button" data-leave="stay" class="primary" data-i18n="leave.stay"></button>
      <button type="button" data-leave="keep" data-i18n="leave.keep"></button>
      <button type="button" data-leave="discard" class="danger" data-i18n="leave.discard"></button>
    </menu>
  </div>
</dialog>

<!-- 保存冲突。不静默覆盖也不静默丢弃：两边都是人写的字，摆出来让人判 -->
<dialog id="dlg-conflict">
  <div class="dlgbody">
    <h2 data-i18n="conflict.title"></h2>
    <p class="hint" id="cf-why"></p>
    <div class="cfsplit">
      <div class="cfpane">
        <h3 id="cf-server-meta"></h3>
        <div class="cfbody mono" id="cf-server"></div>
      </div>
      <div class="cfpane">
        <h3 id="cf-mine-meta"></h3>
        <div class="cfbody mono" id="cf-mine"></div>
      </div>
    </div>
    <p class="hint" data-i18n="conflict.hint"></p>
    <menu>
      <button type="button" data-conflict="cancel" class="primary" data-i18n="conflict.cancel"></button>
      <button type="button" data-conflict="theirs" data-i18n="conflict.theirs"></button>
      <button type="button" data-conflict="mine" class="danger" data-i18n="conflict.mine"></button>
    </menu>
  </div>
</dialog>

<!-- 跟着指针走的小标签。三格分别是「拖的是谁」「要落到哪（或者为什么落不下）」
     「跟着走的还有几步」。第三格最要紧：拖一棵二十步的子树和拖一个光杆节点
     在屏幕上长得一模一样，而后果差二十倍。字全部由 app.js 按 i18n 填。 -->
<div id="dghost" hidden aria-hidden="true">
  <span id="dg-id" class="mono"></span><span id="dg-what"></span><span id="dg-carry"></span>
</div>

<div id="lightbox" hidden>
  <button id="lb-close" data-i18n-title="common.close">×</button>
  <img id="lb-img" alt="">
  <div id="lb-cap"></div>
</div>

<script id="forest-data" type="application/json">__DATA__</script>
<script id="projects-data" type="application/json">__PROJECTS__</script>
<!-- 定稿流程那张图的**字节**。它由服务端那份唯一的生成器画出来（Python 侧的
     pipeline_svg），页面自己一笔都不画：图上五步、Methods 里六步，收到的人只会
     认为这份记录不可信。
     服务模式下这里是空的，页面按需去 /api/p/{项目}/pipeline/figure.svg 取；
     静态导出没有服务端，`build` 把同一份字节直接灌进来（file:// 下 fetch 一个
     相对路径会被当成跨源，取不到）。两条路拿到的是同一个函数的同一份输出。 -->
<script id="pipeline-svg" type="application/json">__PIPESVG__</script>
<script>window.TRACE_BASE = "__BASE__"; window.TRACE_MODE = "__MODE__"; window.TRACE_PROJECT = "__PROJECT__";</script>
<!-- i18n.js 必须排在 app.js 之前：app.js 第一次 paintChrome() 就要 window.i18n。
     它和 md.js 互不依赖，谁前谁后都行。 -->
<script src="__ASSET__i18n.js"></script>
<script src="__ASSET__md.js"></script>
<script src="__ASSET__app.js"></script>
</body>
</html>
