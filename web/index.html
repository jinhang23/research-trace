<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>__TITLE__</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='3' r='2.2' fill='%23777'/><circle cx='4' cy='13' r='2.2' fill='%23999'/><circle cx='12' cy='13' r='2.2' fill='%23555'/><path d='M8 5v3M8 8h4v3M8 8H4v3' stroke='%23888' fill='none' stroke-width='1.4'/></svg>">
<link rel="stylesheet" href="__ASSET__style.css">
</head>
<body>

<header id="top">
  <select id="proj" title="切换项目"></select>
  <div class="grow">
    <input id="search" type="search" placeholder="搜索 id / 标题 / 正文 / 标签   （按 / 聚焦）" autocomplete="off" spellcheck="false">
    <!-- 搜索范围。agent 的 trace_search 不给 project 就搜全部，人这边也得有同一个能力 -->
    <button id="btn-scope" type="button">本项目</button>
    <span id="hits" class="mono"></span>
  </div>
  <div class="seg" id="viewtoggle">
    <button data-view="graph" title="图视图">图</button><button data-view="list" title="列表视图">列表</button>
  </div>
  <button id="btn-new" title="从选中节点派生新步骤（n）">＋ 新步骤</button>
  <!-- 新建项目必须在顶栏：只剩一个项目时项目索引页会 302 弹回项目页，
       按钮长在那个页面上就等于永远点不到 -->
  <button id="btn-newproj" data-newproj="1" title="新建一个项目">＋ 项目</button>
  <button id="btn-token" title="设置写入令牌">🔒</button>
  <!-- 数据仓同步：平时只是一个小箭头，失败时旁边那块红的会露出来 -->
  <span id="gitdot" class="gitdot" hidden></span>
  <button id="gitwarn" data-gitretry="1" hidden>⇅ 同步失败</button>
  <span id="live" class="dot" title="实时连接"></span>
</header>

<!-- 跨项目搜索结果。挂在顶栏下面而不是抢走详情面板：搜索是「顺手查一下」，
     不该把你正在读的那一步顶掉 -->
<div id="hitlist" hidden></div>

<div id="warnbar" hidden></div>

<!-- 项目索引：没有选中项目时显示 -->
<section id="home" hidden>
  <div class="home-head">
    <h1>__TITLE__</h1>
    <button data-newproj="1" class="primary">＋ 新建项目</button>
  </div>
  <div id="cards"></div>
</section>

<main id="main" hidden>
  <section id="left">
    <div id="scroller">
      <!-- 图视图：SVG 画边，HTML 卡片叠在上面（文本截断/hover 都好做） -->
      <div id="dwrap" hidden>
        <div id="diagram">
          <svg id="dedges" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
          <div id="dnodes"></div>
        </div>
      </div>
      <!-- 列表视图：轨道 SVG + 定高行，两者靠固定行高对齐 -->
      <div id="track" hidden>
        <svg id="rails" xmlns="http://www.w3.org/2000/svg" width="0" height="0" aria-hidden="true"></svg>
        <div id="rows"></div>
      </div>
      <p id="empty" hidden>这个项目还没有步骤。点右上角 <b>＋ 新步骤</b> 开始。</p>
    </div>
    <footer id="legend">
      <span><i class="lg done"></i>done 实线</span>
      <span><i class="lg wip"></i>wip 虚线</span>
      <span><i class="lg dead"></i>dead 点线</span>
      <!-- 字形标记是第四个通道：不抢线型（status）也不抢不透明度（祖先链/搜索） -->
      <span class="lgm"><i class="cmk lv0">L0</i>链断了</span>
      <span class="lgm"><i class="cmk rfail">↺✕</i>复现失败</span>
      <span class="sp"></span>
      <span id="zoombar">
        <button data-zoom="out" title="缩小">−</button>
        <button data-zoom="reset" title="回到 100%"><span id="zoomval">100%</span></button>
        <button data-zoom="in" title="放大">＋</button>
        <button data-zoom="fit" title="适应宽度">适应</button>
      </span>
    </footer>
  </section>

  <section id="detail" tabindex="-1"></section>
</main>

<dialog id="dlg-new">
  <form method="dialog">
    <h2>新建步骤</h2>
    <div id="nf-draft" class="draftbar" hidden>
      <b>上次没写完</b><span class="mono" id="nf-draft-when"></span>
      <span id="nf-draft-title"></span>
      <span class="sp"></span>
      <button type="button" data-newdraft="restore">恢复</button>
      <button type="button" data-newdraft="discard">丢弃</button>
    </div>
    <label>派生自 <input id="nf-parent" class="mono" readonly></label>
    <label>标题 <input id="nf-title" maxlength="200" required placeholder="一行说清这一步在干什么"></label>
    <div class="row2">
      <label>状态
        <select id="nf-status">
          <option value="wip">wip — 在做</option>
          <option value="done">done — 有结论</option>
          <option value="dead">dead — 此路不通</option>
        </select>
      </label>
      <label>日期 <input id="nf-date" class="mono" type="date"></label>
    </div>
    <label>commit <input id="nf-commit" class="mono" placeholder="可留空"></label>
    <label>外部路径 · 每行一条，<code>位置 | 说明</code>
      <textarea id="nf-paths" rows="2" spellcheck="false" placeholder="/blue/组名/用户名/exp/agnews | 训练数据，12 GB&#10;https://github.com/你/仓库/tree/9b7d112 | 跑这一步的代码"></textarea>
    </label>
    <label>正文 <textarea id="nf-body" rows="12" spellcheck="false"></textarea></label>
    <p class="hint">「为什么」是整个系统里唯一无法自动生成的字段——日志能自动存，commit 能自动记，只有「我当时为什么决定试这个」必须你写。</p>
    <menu>
      <button value="cancel">取消</button>
      <button id="nf-ok" value="ok" class="primary">创建</button>
    </menu>
  </form>
</dialog>

<!-- 离开编辑器前的确认。三个出口而不是两个：用户真正想说的第三件事是
     「这段我不要了，别再拿草稿烦我」 -->
<dialog id="dlg-leave">
  <div class="dlgbody">
    <h2>还有没保存的改动</h2>
    <p class="hint"><b id="leave-what" class="mono"></b><br>
      内容已经自动存进这台机器的浏览器草稿里，离开不会丢。
      下次打开这一步会问你要不要恢复。</p>
    <menu>
      <button type="button" data-leave="stay" class="primary">继续编辑</button>
      <button type="button" data-leave="keep">离开（保留草稿）</button>
      <button type="button" data-leave="discard" class="danger">丢弃草稿并离开</button>
    </menu>
  </div>
</dialog>

<!-- 保存冲突。不静默覆盖也不静默丢弃：两边都是人写的字，摆出来让人判 -->
<dialog id="dlg-conflict">
  <div class="dlgbody">
    <h2>这一步在你编辑期间被改过</h2>
    <p class="hint" id="cf-why"></p>
    <div class="cfsplit">
      <div class="cfpane">
        <h3 id="cf-server-meta"></h3>
        <div class="cfbody mono" id="cf-server"></div>
      </div>
      <div class="cfpane">
        <h3 id="cf-mine-meta"></h3>
        <div class="cfbody mono" id="cf-mine"></div>
      </div>
    </div>
    <p class="hint">高亮的是两边不一样的行。选哪个都不会丢东西：保留服务器版本时，
      你的这份仍然留在浏览器草稿里。</p>
    <menu>
      <button type="button" data-conflict="cancel" class="primary">回编辑器再看看</button>
      <button type="button" data-conflict="theirs">保留服务器版本</button>
      <button type="button" data-conflict="mine" class="danger">用我的覆盖</button>
    </menu>
  </div>
</dialog>

<div id="lightbox" hidden>
  <button id="lb-close" title="关闭（Esc）">×</button>
  <img id="lb-img" alt="">
  <div id="lb-cap"></div>
</div>

<script id="forest-data" type="application/json">__DATA__</script>
<script id="projects-data" type="application/json">__PROJECTS__</script>
<script>window.TRACE_BASE = "__BASE__"; window.TRACE_MODE = "__MODE__"; window.TRACE_PROJECT = "__PROJECT__";</script>
<script src="__ASSET__md.js"></script>
<script src="__ASSET__app.js"></script>
</body>
</html>
