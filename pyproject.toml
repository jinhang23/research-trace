[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "research-trace"
version = "2.0.0a26"
description = "团队研究与项目记忆：完整 agent 历史与精选语义记录"
readme = "README.md"
requires-python = ">=3.10"

# Pin the supported SDK major; protocol transport belongs to the upstream SDK.
dependencies = ["mcp>=1.29,<2", "filelock>=3.16,<4"]

[project.urls]
Homepage = "https://github.com/jinhang23/research-trace"

# 装完之后这几个就是真正的命令（Windows 上是 Scripts/*.exe），于是 MCP 配置写成
# `command: trace-mcp`，和别的 MCP server 形状一致，不用写死某个 .py 的绝对路径。
[project.scripts]
trace-mcp = "research_trace.mcp:main"
trace-server = "research_trace.server:main"
trace-backup = "research_trace.backup:main"
trace-login = "research_trace.device_login:main"
# 投递权威是这个独立进程，不是 hook、也不是 Recorder：它扫 outbox 全部 session，
# 只有中央返回 2xx 才把文件搬进 sent/。trace-project 是采集的 opt-in 绑定入口。
trace-deliver = "research_trace.deliver:main"
trace-project = "research_trace.deliver:project_main"
trace-code = "research_trace.workspace:main"

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.27", "sqlalchemy>=2,<3", "alembic>=1.13,<2", "authlib>=1.6,<2", "httpx>=0.28,<1"]
dev = ["pytest", "httpx>=0.27,<1"]
integrations = ["mlflow-skinny>=3.14,<4", "mcp>=1.20,<2"]

[tool.setuptools]
packages = ["research_trace"]
# 根目录那三个 .py 只是薄薄的入口转发（给不想用 console script 的人直接
# `python trace_server.py` 用），本体全在 research_trace 包里。
py-modules = ["trace_mcp", "trace_server", "trace_login"]

[tool.setuptools.package-data]
research_trace = ["static/*", "migrations/*.py", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
